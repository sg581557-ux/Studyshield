    <!-- Host canonicalization disabled: workers.dev and custom domain both serve same assets.

    <script>
      // Apply theme before paint to avoid flash of incorrect theme.
      (function () {
        try {
          var t = localStorage.getItem("studyshield-theme");
          if (!t) t = "dark";
          var resolved = t === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : t;
          var root = document.documentElement;
          root.classList.add(resolved);
          root.classList.remove(resolved === "dark" ? "light" : "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
